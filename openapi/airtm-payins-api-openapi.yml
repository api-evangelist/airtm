openapi: 3.2.0
info:
  title: Airtm Enterprise API V2 Payins API
  version: 1.155.0
  description: '# Introduction


    The Airtm Enterprise API enables organizations to send and receive payments globally through a simple REST API.'
  contact:
    name: Airtm Enterprise
    email: enterprise@airtm.com
    url: https://www.airtm.com
servers:
- url: https://api.enterprise.airtm.com/v2
- url: https://api.stg.enterprise.airtm.com/v2
tags:
- name: Payins
  description: '# Payins


    The Payins API enables you to collect payments from users worldwide through their Airtm accounts.'
paths:
  /payins:
    post:
      operationId: CreatePayin
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    description: 'Machine-friendly error code


                      See the API error code catalog in the documentation for the endpoint surface you are using.'
                    example: '415096'
                  message:
                    type: string
                    description: Human-readable error message
                    example: Invalid email address
                  data:
                    $ref: '#/components/schemas/Record_string.unknown_'
                    description: Additional data related to the error
                    example:
                      email: invalid@address
                required:
                - code
                - message
                type: object
      description: 'This endpoint will allow you to create a payin.

        In order to complete a payin, it must first be created, then the user must be directed to the Airtm website to confirm/checkout the payin, at which time they will be redirected to a URL of your choosing. See “Usage” below.


        We will redirect the user to either `confirmationUri` or `cancelUri` with code as a query parameter so you can process the payin as being either confirmed or cancelled.


        ## Usage


        1. Create a payin.

        2. Extract the `id` from the response and redirect the user to: https:///payin/:id User will be redirected for authentication as necessary.

        3. User will confirm or cancel payin from Airtm’s website.

        4. If confirmed, money will be transferred from the user’s Airtm wallet, to your account, and the user will be redirected to the provided `confirmationUri`.

        If canceled, no money will be transferred, and the user will be redirected to the provided `cancelUri`.


        Upon confirmation or cancellation, the payin will be considered completed, and the URL residing at /payin/:id will no longer function.

        Therefore, if you wish to complete an identical payin, you will need to create a new one.


        The `confirmationUri` attribute should not be used for transaction completeness verification, if the URI was requested, it doesn''t mean the transaction was completed successfully.


        ## Redirection


        > [!important]

        > If you are integrating our API in a mobile application, you will need to redirect the user with the payin generated url by making sure that you open the user’s external browser.

        > By implementing this, the user’s device will be able to successfully handle deeplinks and redirect the users to the Airtm app to finish the operation.


        Here are some code snippets in the most popular mobile development frameworks for you to implement the redirection:


        ### Swift Example


        ```swift

        // instead of opening a WKWebView or a Safari View Controller, do this:


        let url = URL(string: "https://app.airtm.com/payin/payin-id")

        if UIApplication.shared.canOpenURL(url) {

        UIApplication.shared.open(url)

        }

        ```


        ### Kotlin Example


        ```kotlin

        val url = "https://app.airtm.com/payin/payin-id"

        fun Context.openUrl(url: String?) {

        if (url == null) return


        val browserIntent = Intent(Intent.ACTION_VIEW, Uri.parse(url))


        kotlin.runCatching {

        this.startActivity(browserIntent)

        }.onFailure {

        // handle errors gracefully

        }

        }

        ```


        ### Flutter Example


        ```dart

        import ''package:url_launcher/url_launcher.dart'';


        void openUrl(String? url) async {

        if (url == null) return;


        final uri = Uri.parse(url);


        try {

        await launchUrl(uri, mode: LaunchMode.externalApplication);

        } catch (_) {

        // Fail silently or log if needed

        }

        }

        ```


        ### React Native Example


        ```typescript

        import { Linking } from ''react-native'';


        const openUrl = async (url: string | null | undefined) => {

        if (!url) return;


        try {

        const supported = await Linking.canOpenURL(url);

        if (supported) {

        await Linking.openURL(url);

        }

        // If not supported, you can silently fail or log

        } catch (error) {

        // Optional: Handle errors silently or log

        }

        };

        ```'
      summary: Create a Payin
      tags:
      - Payins
      security:
      - basicAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayinRequest'
    get:
      operationId: ListPayins
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginated_PayinResponse_'
        default:
          description: Error
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    description: 'Machine-friendly error code


                      See the API error code catalog in the documentation for the endpoint surface you are using.'
                    example: '415096'
                  message:
                    type: string
                    description: Human-readable error message
                    example: Invalid email address
                  data:
                    $ref: '#/components/schemas/Record_string.unknown_'
                    description: Additional data related to the error
                    example:
                      email: invalid@address
                required:
                - code
                - message
                type: object
      description: Endpoint to list all payins associated with your account.
      summary: List payins
      tags:
      - Payins
      security:
      - basicAuth: []
      parameters:
      - description: Gets results before the specified cursor.
        in: query
        name: before
        required: false
        schema:
          type: string
      - description: Gets results after the specified cursor.
        in: query
        name: after
        required: false
        schema:
          type: string
      - description: The maximum number of items to fetch.
        in: query
        name: perPage
        required: false
        schema:
          default: 100
          format: int32
          type: integer
          minimum: 10
          maximum: 1000
      - in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/PayinStatus'
      - in: query
        name: enterpriseId
        required: false
        schema:
          type: string
  /payins/{id}:
