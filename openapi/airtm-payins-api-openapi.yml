components:
  schemas:
    Email:
      type: string
      pattern: ^(.+)@(.+)$
    PayinStatus:
      description: 'The current status of the payin


        - `CREATED`: The payin has been created but not yet confirmed.

        - `CONFIRMED`: The payin has been confirmed and is ready for processing.

        - `CANCELED`: The payin has been canceled by the user or system.

        - `PROCESSING`: The payin is currently being processed.

        - `FAILED`: The payin has failed due to an error.

        - `BRIDGE_FAILED`: The payin has failed due to an error in Bridge.

        - `BRIDGE_CANCELED`: The payin has been canceled due to an error in Bridge.'
      enum:
      - CREATED
      - CONFIRMED
      - CANCELED
      - PROCESSING
      - FAILED
      - BRIDGE_FAILED
      - BRIDGE_CANCELED
      type: string
      x-enum-varnames:
      - CREATED
      - CONFIRMED
      - CANCELED
      - PROCESSING
      - FAILED
      - BRIDGE_FAILED
      - BRIDGE_CANCELED
    Paginated_PayinResponse_:
      description: Represents a paginated collection of items.
      properties:
        items:
          items:
            $ref: '#/components/schemas/PayinResponse'
          type: array
          description: The items in the current page.
        startCursor:
          type: string
          description: The cursor for the first item in the current page.
        endCursor:
          type: string
          description: The cursor for the last item in the current page.
      required:
      - items
      type: object
      additionalProperties: false
    CreatePayinItem:
      properties:
        description:
          type: string
          description: An arbitrary string describing the individual item.
        amount:
          type: number
          format: double
          description: The price in USD of the individual item.
          example: 10
          minimum: 0.01
        quantity:
          type: number
          format: double
          description: 'The number of items being purchased.

            This will be multiplied with the ''amount'' value to calculate the total.'
          example: 1
          minimum: 1
      required:
      - description
      - amount
      - quantity
      type: object
      additionalProperties: false
    Record_string.unknown_:
      properties: {}
      additionalProperties: {}
      type: object
      description: Construct a type with a set of properties K of type T
    PayinItem:
      description: An item within a payin transaction
      properties:
        description:
          type: string
          description: An arbitrary string describing the individual item.
        amount:
          type: number
          format: double
          description: The price in USD of the individual item.
          example: 10
          minimum: 0.01
        quantity:
          type: number
          format: double
          description: 'The number of items being purchased.

            This will be multiplied with the ''amount'' value to calculate the total.'
          example: 1
          minimum: 1
        id:
          type: string
          description: The unique identifier for the item
          format: uuid
        payinId:
          type: string
          description: The unique identifier for the payin.
          format: uuid
      required:
      - description
      - amount
      - quantity
      - id
      - payinId
      type: object
      additionalProperties: false
    PayinResponse:
      description: 'A payin is a transaction that transfers funds from a user''s Airtm account to an enterprise''s account.

        Normally, the payin represents a purchase made by a user.'
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: The unique identifier for the payin.
        code:
          type: string
          description: 'An arbitrary string of the partner’s choosing. Used to identify and correlate Airtm purchases with partner records.


            > [!important]

            > Must be a unique.'
        hash:
          type: string
          description: Unique hash for the payin operation within the Airtm system.
        status:
          $ref: '#/components/schemas/PayinStatus'
        amount:
          type: number
          format: double
          description: Amount in USD that was transacted in the operation.
          example: 10
        netAmount:
          type: number
          format: double
          description: Amount in USD to be received by the enterprise
          example: 9.5
        airtmFee:
          type: number
          format: double
          description: Amount to be collected by Airtm as fee
          example: 0.5
        description:
          type: string
          description: 'A text string describing the purchase.


            > [!tip]

            > This text is displayed to the user when they are confirming the transaction.'
        items:
          items:
            $ref: '#/components/schemas/PayinItem'
          type: array
          description: An array of the items being purchased/bought.
        airtmUserId:
          $ref: '#/components/schemas/Uuid'
          description: The unique identifier for the AirTM user associated with this payin.
        airtmUserEmail:
          $ref: '#/components/schemas/Email'
          description: The email of the Airtm user associated with this payin.
        failureReason:
          type: string
          description: If the payin failed to complete, this field will describe why it failed.
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the payin was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last update made to the payin.
        confirmationUri:
          type: string
          description: A URL to redirect the user to when they confirm the transaction.
          format: url
        cancelUri:
          type: string
          description: A URL to redirect the user to when they cancel the transaction.
          format: url
      required:
      - id
      - code
      - status
      - amount
      - netAmount
      - airtmFee
      - description
      - items
      - createdAt
      - updatedAt
      - confirmationUri
      - cancelUri
      type: object
      additionalProperties: false
    CreatePayinRequest:
      properties:
        code:
          type: string
          description: 'An arbitrary string of the partner’s choosing. Used to identify and correlate Airtm purchases with partner records.


            > [!important]

            > Must be unique.'
        amount:
          type: number
          format: double
          description: 'The total amount in USD of the purchase.


            > [!important]

            > This value must correctly correspond to the sum of the amounts associated with each purchase item.'
        description:
          type: string
          description: A text string describing the purchase. This text is displayed to the user when they are confirming the transaction.
          maximum: 250
        items:
          items:
            $ref: '#/components/schemas/CreatePayinItem'
          type: array
          description: An array of the items being purchased/bought.
        confirmationUri:
          type: string
          description: A URL to redirect the user to when they confirm the transaction.
          format: url
        cancelUri:
          type: string
          description: A URL to redirect the user to when they cancel the transaction.
          format: url
      required:
      - code
      - amount
      - description
      - items
      - confirmationUri
      - cancelUri
      type: object
      additionalProperties: false
    Uuid:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
