  bulk-payments/{bulkPaymentId}/errors:
    get:
      security:
      - basicAuth: []
      tags:
      - Bulk Payments
      summary: Get failed bulk payments
      description: 'This endpoint allows you to see the parts of your bulk payment that

        could not be processed. There is no way to restart them other than to

        create a new bulk payment. There may be unlikely occurrences where some

        errors might not be clear or will only contain an error code. Please

        reach out to enterprise@airtm.com, we are eager to improve the API or

        explain why a payment cannot be processed.


        There is no way of restarting a failed payment. You must post a new bulk

        payment or contact support.


        This endpoint is paginated, so make sure to "flip through the pages" via

        the query parameter "page" if you need to get all the information.

        '
      operationId: Bulk Payments_bulk-payments/get-failed-bulk-payments
      parameters:
      - name: bulkPaymentId
        in: path
        required: false
        schema:
          type: String
          example: ''
