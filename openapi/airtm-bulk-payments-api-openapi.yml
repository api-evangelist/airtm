  bulk-payments/{bulkPaymentId}/payments/cancel:
    post:
      security:
      - basicAuth: []
      tags:
      - Bulk Payments
      summary: Cancel pending bulk payments
      description: 'This endpoint enables users to manually cancel specific or all `pending`

        individual payouts within a bulk payment. Users can input transaction

        `hash` IDs for specific pending payouts they wish to cancel, retrievable

        from the GET bulk payments by id. If no hash is included in the request

        body, the endpoint will cancel all pending payouts associated with the

        bulk payment. Pending payouts will automatically cancel after 90 days

        (by default, other time periods are avilable in dashboard settings) from

        the creation date. Once canceled, funds are automatically restituted to

        user''s Airtm balance, and individual payout status are updated to

        `canceled`.

        '
      operationId: Bulk Payments_bulk-payments/cancel-pending-payments-1
      parameters:
      - name: bulkPaymentId
        in: path
        required: false
        schema:
          type: String
          example: ''
          description: ''
          default: ''
        description: ''
      - name: Content-Type
        in: header
        required: false
        schema:
          type: String
          example: application/json
          description: ''
          default: ''
        description: ''
      - name: Authorization
        in: header
        required: false
        schema:
          type: String
          example: Basic {your_token}
          description: ''
          default: ''
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  successful:
                    type: array
                    description: ''
                    items:
                      type: string
                      description: ''
                      example: CADBEW460EXAMPLE
        '422':
          description: Bulk Payment ID not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Description on standard bulk payment ID format.
                    example: Unprocessable entity
                  messages:
                    type: object
                    description: ''
                    properties:
                      id:
                        type: array
                        description: ''
                        items:
                          type: string
                          description: ''
                          example: 'id must match the following:

                            "/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/"

                            '
                    required: []
