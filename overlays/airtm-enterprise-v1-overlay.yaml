    x-apievangelist-gaps:
      no_component_schemas: >-
        components.schemas is empty — all 18 operations inline their shapes, so nothing is reusable
        and no generated client produces shared models.
      operation_id_quality: >-
        operationIds are path-derived strings containing spaces, slashes and underscores (e.g.
        "Purchases _ Payins_purchases-payins/create-purchase"). They are unique but are not valid
        identifiers in most target languages, so generators must mangle them.
      paths_not_rooted: >-
        Path keys are relative ("purchases", "payouts/{payoutId}/commit") rather than rooted with a
        leading slash as OpenAPI requires.
      colon_style_path_param: >-
        One path uses Express-style syntax ("payouts/events/:payoutId") instead of OpenAPI's
        {payoutId} template, so that parameter is not machine-readable.
      no_error_responses: No 4xx/5xx or default responses are declared anywhere in the document.
      no_security_requirement: >-
        basicAuth is defined in components.securitySchemes but never applied at root or operation level.
