key_separation:
  mechanism: separate API keys per environment
  prefix_convention: none published — Airtm does not publish a test/live key prefix (no sk_test_/sk_live_ equivalent)
  guidance: >-
    "Never mix environments. Use sandbox keys only in sandbox, production keys only in production."
    Keys are generated per environment in the respective Enterprise dashboard.
obtaining_access:
  self_serve_signup: https://app.stg.airtm.io/login
  assisted: >-
    Airtm's Onboarding or Account Manager can provision sandbox accounts for temporary use so the
    integrator does not have to create them.
  enterprise_intake: https://airtm-product.typeform.com/to/ggXbsJpl
test_data:
  fake_money_provided: false
  note: >-
    IMPORTANT DIVERGENCE FROM MOST PAYMENT SANDBOXES — Airtm publishes NO magic test values. There
    are no test card numbers, no test bank accounts, no test IBANs, no hosted test tokens and no
    decline-simulation values. Sandbox accounts need a real (sandbox) balance, which an account
    manager must credit on request.
  minimum_accounts_required: 2
  minimum_accounts_reason: >-
    "You cannot receive payments or confirm purchases created by yourself" — an integrator needs at
    least two sandbox accounts to play both sender and receiver.
  balance_funding: contact your account manager to add funds to sandbox accounts
test_clocks:
  supported: false
fixtures_and_triggers:
  supported: false
  note: >-
    No fixture/trigger tooling is published. Transaction state is exercised by driving real sandbox
    accounts through the flow, and webhook deliveries are inspected in the Svix portal.
