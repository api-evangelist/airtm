docs: https://docs.airtm.com/
spec_type: Webhooks
asyncapi_published: false
asyncapi_note: >-
  Airtm publishes NO AsyncAPI document — /asyncapi.json and /asyncapi.yaml return 404 on the API
  host. The event surface is real and machine-readable only insofar as the V2 OpenAPI declares a
  top-level `webhooks` object with eight events carrying full request-body schemas. That is captured
  verbatim in openapi/airtm-enterprise-v2-openapi.json; this file is the catalog view.
delivery:
  provider: Svix
  migrated: '2025-07'
  configuration_url: https://enterprise.airtm.com/settings/webhooks
  portal_operation: GetPortalUrl (GET /v2/embedded/webhooks/portal-url)
  signature_verification: true
  retries: automatic retries for failed deliveries
  transport: HTTPS POST
  acknowledgement: return a 2xx status
  source_ips_published: true
  source_ips_docs_section: 'Connecting → IP Addresses'
