wallet_resource_events:
  note: >-
    The OAuth-gated Wallet Resource (Connect) API emits four further events over the same Svix
    delivery. These are documented in prose only — they are NOT declared in the OpenAPI `webhooks`
    object, so no machine-readable payload schema is published for them.
  events:
  - {name: oidc.transaction.created, fired_when: 'A transaction is registered (status created or pending_user_confirmation).'}
  - {name: oidc.transaction.pendingSettlement, fired_when: 'The Stellar transaction is broadcast and observed (status pending_settlement).'}
  - {name: oidc.transaction.completed, fired_when: 'The transaction settles successfully (status completed).'}
  - {name: oidc.transaction.failed, fired_when: 'The transaction fails terminally (status failed).'}
  payload_note: >-
    Every event wraps the same transaction object returned by the REST endpoints. On a terminal event
    where the underlying quote can no longer be loaded, amountToSend / amountToReceive / fees are
    delivered as null so the status change is never dropped; the REST read endpoints never return
    those as null.
consumer_guidance:
- Return a 2xx HTTP status to acknowledge receipt.
- Implement signature verification (Svix).
- Use HTTPS for all webhook URLs.
- Handle idempotency to prevent duplicate processing.
- Implement retry logic for temporary failures.
- Allowlist the published Airtm egress IPs.
