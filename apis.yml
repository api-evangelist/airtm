aid: airtm
name: Airtm
description: >-
  Airtm is a US-registered (Airtm Inc., Delaware; FinCEN MSB #31000329787639) digital dollar wallet
  and cross-border payments network operating since 2015, built for freelancers, remote workers,
  contractors and businesses in emerging markets. Balances are held as USDC on Stellar and can be
  moved in and out through 500+ local payment methods, a US virtual account with ACH details, a USD
  virtual card, and peer-to-peer transfer. For businesses, Airtm publishes the Enterprise Payments
  API — a REST API for programmatic payouts to recipients in 190+ countries, hosted-checkout payins,
  bulk payouts, external bank and crypto accounts, withdrawals and reporting — plus an OAuth 2.0 /
  OIDC authorization server and a Wallet Resource (Connect) API that lets a partner application move
  value in and out of an individual user's Airtm wallet on that user's behalf.
