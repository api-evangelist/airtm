apis:
- name: Airtm Enterprise API V2
  description: >-
    The current generation of the Airtm Enterprise Payments API. REST over HTTPS with HTTP Basic
    authentication (API key + secret), covering payouts (two-step create/commit), bulk payouts,
    payins with hosted checkout, deposits, withdrawals, external bank and crypto accounts, user
    lookup, reports, API key management, and an embedded money-movement surface (senders, receivers,
    quotes, transactions, payment-rail catalog). Ships 51 operations and 121 component schemas, and
    declares eight webhook events delivered via Svix.
  humanURL: https://docs.airtm.com/
  baseURL: https://api.enterprise.airtm.com/v2
  tags:
  - payments
  - payouts
  - payins
  - bulk-payouts
  - cross-border-payments
  - reporting
  properties:
  - type: OpenAPI
    url: openapi/airtm-enterprise-v2-openapi.json
  - type: Documentation
    url: https://docs.airtm.com/
  - type: APIReference
    url: https://docs.airtm.com/
  - type: Overlay
    url: overlays/airtm-enterprise-v2-overlay.yaml
  - type: Webhooks
    url: asyncapi/airtm-webhooks.yml
- name: Airtm Enterprise API V1
  description: >-
    The legacy first-generation Airtm payments API, still published as OpenAPI 3.1.0 and served from
    the payments.air-pay.io host. Covers purchases/payins, payouts (including a one-step payout),
    operations lookup, partner balance, bulk payments and account status across 18 operations.
    Superseded by the V2 Enterprise API for new integrations.
  humanURL: https://docs.airtm.com/
  baseURL: https://payments.air-pay.io
  tags:
  - payments
  - payouts
  - payins
  - bulk-payouts
  - legacy
  properties:
  - type: OpenAPI
    url: openapi/airtm-enterprise-v1-openapi.json
  - type: Documentation
    url: https://docs.airtm.com/
  - type: Overlay
    url: overlays/airtm-enterprise-v1-overlay.yaml
- name: Airtm Wallet Resource (Connect) API
  description: >-
    The OAuth 2.0 resource server that lets a partner application move USDC in and out of an
    individual Airtm user's wallet on that user's behalf, read the wallet balance, and check KYC
    status. Authorized with bearer access tokens issued by the Airtm OIDC authorization server and
    gated per endpoint by the wallet:read, wallet:receive, wallet:send and kyc:status scopes.
    Quotes and transactions require an Idempotency-Key header; every wallet:send transaction is
    confirmed by the user with a one-time code. Documented in the Enterprise API reference; no
    standalone machine-readable spec is published for it.
  humanURL: https://docs.airtm.com/
  baseURL: https://api.enterprise.airtm.com/api/connect/v1
  tags:
  - wallet
  - oauth2
  - openid-connect
  - stablecoin
  - usdc
  - stellar
