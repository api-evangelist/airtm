- name: Airtm Wallet Resource (Connect) API
  description: >-
    The OAuth 2.0 resource server that lets a partner application move USDC in and out of an individual
    Airtm user's wallet on that user's behalf, read the wallet balance, and check KYC status. Authorized
    with bearer access tokens issued by the Airtm OIDC authorization server and gated per endpoint by
    the wallet:read, wallet:receive, wallet:send and kyc:status scopes. Quotes and transactions require
    an Idempotency-Key header; every wallet:send transaction is confirmed by the user with a one-time
    code. Documented in the Enterprise API reference; no standalone machine-readable spec is published
    for it.
