method: searched
source: >-
  https://api.enterprise.airtm.com/openapi.json (info.description — "Reason Codes" guide, plus the
  Wallet Resource API "Error codes" table)
docs: https://docs.airtm.com/
format: proprietary
envelope:
  content_type: application/json
  fields:
    code: Machine-friendly Airtm reason code (string, e.g. "415096")
    message: Human-readable error message
    data: Optional object with additional data related to the error
  required: [code, message]
  note: >-
    Not RFC 9457. There is no `type` URI, no `title`/`detail` split, and no application/problem+json
    media type. Webhook payloads carry the same code on `reasonCode` / `reasonDescription`.
