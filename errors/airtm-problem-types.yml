documented_http_statuses_outside_spec:
- status: 400
  meaning: Missing Idempotency-Key on POST /quotes or POST /transactions
- status: 401
  meaning: Unauthorized — bad Basic credentials, or Bearer invalid_token
- status: 403
  meaning: Forbidden — account permissions, or Bearer insufficient_scope
- status: 409
  meaning: Conflict — idempotency-key replay with a different body, duplicate partnerReference, open withdrawal,
    wrong 2FA state
- status: 422
  meaning: Unprocessable — expired/mismatched quote, memo too long, amount window, invalid 2FA code
- status: 429
  meaning: Rate limit exceeded (10 rps per API key)
- status: 503
  meaning: User's 2FA settings could not be verified — retryable
